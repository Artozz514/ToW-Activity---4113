<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>ToW Dashboard Tutorial</title>
<style>
:root{color-scheme:light;--page:#f9f9f7;--surface:#fcfcfb;--ink:#0b0b0b;--ink-2:#52514e;--border:rgba(11,11,11,.10);--accent:#2a78d6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--page:#0d0d0d;--surface:#1a1a19;--ink:#f0efec;--ink-2:#c3c2b7;--border:rgba(255,255,255,.10);--accent:#3987e5}}
:root[data-theme="dark"]{color-scheme:dark;--page:#0d0d0d;--surface:#1a1a19;--ink:#f0efec;--ink-2:#c3c2b7;--border:rgba(255,255,255,.10);--accent:#3987e5}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:24px 16px 40px}
h1{font-size:22px;margin:0 0 4px;font-weight:650}
p{color:var(--ink-2);margin:0 0 16px}
.player{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:8px}
video{display:block;width:100%;height:auto;border-radius:8px;background:#000}
.cta{display:inline-block;margin-top:16px;padding:9px 16px;border-radius:8px;background:var(--accent);color:#fff;text-decoration:none;font-weight:600}
.cta:hover{filter:brightness(1.08)}
</style>
</head>
<body>
<div class="wrap">
  <h1>ToW · Activity dashboard tutorial</h1>
  <p>How to read the weekly activity dashboard: targets, score, flags and actions to take.</p>
  <div class="player">
    <video controls playsinline preload="metadata" src="tutorial.mp4">
      Your browser cannot play this video. <a href="tutorial.mp4">Download it</a>.
    </video>
  </div>
  <a class="cta" href="../">Open the dashboard →</a>
</div>
</body>
</html>
