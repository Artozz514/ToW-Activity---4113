# =====================================================================
#  CONFIGURATION DU DASHBOARD ROYAUME — 4113
#  Indépendant du dashboard alliance (config.yaml).
# =====================================================================

royaume: 4113

dossiers:
  exports: "data/kingdom/raw"   # déposer ici l'export CSV hebdo du royaume, sans le renommer
  sortie: "output/kingdom"      # dashboard.html, historique_royaume.csv, resume_royaume.csv
  # migrants approuvés sur Discord (colonne governor_id) : tag « légal - Discord » dans les arrivées.
  # Seuls les Governor IDs sont mis dans le dashboard, jamais les pseudos Discord.
  migrants_acceptes: "data/kingdom/migrants_acceptes.csv"
  # migrants illégaux signalés (colonne governor_id) : tag « illégal », lié à l'ID (suit les changements de pseudo)
  migrants_illegaux: "data/kingdom/migrants_illegaux.csv"
  # blacklist (governor_id, raison, date_ajout) : section « Blacklist » du dashboard ;
  # nom, power et anciens noms sont complétés automatiquement à chaque exécution
  blacklist: "data/kingdom/blacklist.csv"

# Vue « Top N » : le toggle en haut de la page ne garde que les N plus gros
# gouverneurs (classés par power) de chaque semaine, pour toutes les sections.
top_n: 400

# Colonnes de l'export utilisées (noms exacts dans le CSV)
colonnes:
  id: "Governor ID"
  pseudo: "Governor Name"
  ch: "CH"
  power: "Power"
  kp: "Total KP"
  t4_kills: "T4"                # nombre CUMULÉ d'unités T4 tuées (pas de la puissance de troupes)
  t5_kills: "T5"                # nombre CUMULÉ d'unités T5 tuées
  periode_minutes: "Period"     # durée couverte par les deltas de l'export, en minutes
  date_debut: "From Date"       # sert à rattacher le fichier à sa semaine (lundi → dimanche)
  date_fin: "To Date"           # suivi arrêté avant le dimanche => semaine « en cours »
  # deltas fournis par l'export : utilisés UNIQUEMENT pour la toute première semaine
  # (pas encore de semaine précédente à comparer)
  power_change: "Power Change"
  kp_change: "Kill Points Change"
  t4_change: "T4 Change"
  t5_change: "T5 Change"

# ---------------------------------------------------------------------
#  PUBLICATION (GitHub Pages) — même dépôt que le dashboard alliance,
#  servi dans un sous-dossier : https://artozz514.github.io/ToW-Activity---4113/kingdom/
# ---------------------------------------------------------------------
publication:
  activer: true
  dossier: "docs/kingdom"
  branche: "main"
  url: "https://artozz514.github.io/ToW-Activity---4113/kingdom/"
